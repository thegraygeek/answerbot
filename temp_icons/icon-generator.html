<!DOCTYPE html>
<html>
<head>
    <title>App Icon Generator</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: white;
        }
        
        .icon-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 512px;
            height: 512px;
            background-color: #1e293b;
            border-radius: 50%;
            overflow: hidden;
            box-sizing: border-box;
        }
        
        .icon-192 {
            width: 192px;
            height: 192px;
        }
        
        .icon-512 {
            width: 512px;
            height: 512px;
        }
        
        .icon-image {
            width: 75%;
            height: auto;
            filter: brightness(0) invert(1);
        }
    </style>
</head>
<body>
    <div class="icon-container icon-512" id="icon-512">
        <img src="../attached_assets/TTwW Logo v4.png" class="icon-image" />
    </div>
    
    <div class="icon-container icon-192" id="icon-192" style="margin-top: 20px;">
        <img src="../attached_assets/TTwW Logo v4.png" class="icon-image" />
    </div>
</body>
</html>
